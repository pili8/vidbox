name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # 补全 android 脚手架（保留已手写的 MainActivity.kt 与 AndroidManifest.xml）
      - name: Generate platform scaffold
        run: flutter create --org com.vidbox --project-name vidbox --platforms android .

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidbox-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # 仅当打 tag（v*）时创建 Release，附上 APK
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
